name: tests

# Unit tests only: they need no display, no Electron and no network (the AI is mocked).
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test
